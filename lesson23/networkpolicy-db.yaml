apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-from-wordpress
  namespace: wordpress
spec:
  podSelector:
    matchLabels:
      app: mysql        # <-- метки подов БД
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress  # <-- метки подов WordPress (в том же ns)
      ports:
        - protocol: TCP
          port: 3306
