version: "3.9"

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # UI
      - "50000:50000" # inbound agents (опционально)
    environment:
      - JAVA_OPTS=
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
