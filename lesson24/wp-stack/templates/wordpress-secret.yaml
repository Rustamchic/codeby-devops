apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wp-stack.wordpress.fullname" . }}-secret
  labels:
    {{- include "wp-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  WORDPRESS_DB_USER: {{ .Values.mysql.auth.username | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.mysql.auth.password | quote }}
