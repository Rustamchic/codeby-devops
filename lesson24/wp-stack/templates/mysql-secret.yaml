apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wp-stack.mysql.fullname" . }}-secret
  labels:
    {{- include "wp-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.auth.rootPassword | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.auth.password | quote }}
