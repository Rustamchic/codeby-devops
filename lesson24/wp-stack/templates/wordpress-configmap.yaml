apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wp-stack.wordpress.fullname" . }}-cm
  labels:
    {{- include "wp-stack.labels" . | nindent 4 }}
data:
  WORDPRESS_DB_HOST: {{ printf "%s.%s.svc.cluster.local:%d" (include "wp-stack.mysql.fullname" .) .Release.Namespace (int .Values.mysql.service.port) | quote }}
  WORDPRESS_DB_NAME: {{ .Values.mysql.auth.database | quote }}
{{- if .Values.wordpress.env.extra }}
{{- range $k, $v := .Values.wordpress.env.extra }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
